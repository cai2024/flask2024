<div class="row">
    <div class="col-md-12">
        <div class="border p-3 mb-4 box-fixed-height">
            <h2 class="h5">步骤按钮</h2>
            <div class="row">
                {% for category, buttons in available_steps.items() %}
                    <div class="col-md-3 mb-3">
                        <div class="card">
                            <div class="card-header">{{ category }}</div>
                            <div class="card-body">
                                {% for button in buttons %}
                                    <button class="btn btn-primary btn-block mb-2" 
                                        id="btn-{{ category }}-{{ button }}" 
                                        onclick="addStep('{{ button }}')">{{ button }}</button>
                                {% endfor %}
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
    <div class="col-md-12">
        <div class="border p-3 box-fixed-height">
            <h2 class="h5">展示参数</h2>
            <div id="outputArea"></div>
        </div>
    </div>
</div>


<script>
    var presetIds = ["WGSBtn","WGBSBtn","CSBtn","CAPSBtn"];
    var buttonIds = [];
    var buttonIds2 = [];
    {% for category, buttons in available_steps.items() %}
        {% for button in buttons %}
            buttonIds.push('btn-{{ category }}-{{ button }}');
	    buttonIds2.push('{{ button }}');
        {% endfor %}
    {% endfor %}

let steps = [];
function addStep(type) {
    const stepId = steps.length;
    const stepItem = `<li class="list-group-item step-item" id="step-${stepId}">${type}</li>`;
    $('#selected-steps').append(stepItem);
    $('#selected-steps').sortable({
        update: function(event, ui) {
            updateStepOrder();
        }
    });
    $('#selected-steps').disableSelection();
    steps.push({ id: stepId, type: type, select_option: {}, params:'', mode: fq_type, raw_type: raw_myOptions[0]});
}

function updateStepOrder() {
    const newOrder = [];
    $('#selected-steps').children().each(function(index, element) {
        const stepId = parseInt(element.id.replace('step-', ''));
        newOrder.push(steps.find(step => step.id === stepId));
    });
    steps = newOrder;
}




var raw_myOptions = [localStorage.getItem('selectedFileType') || "raw.fq.gz"];
var fq_type = localStorage.getItem('selectedFqType') || "single";
var temp_options = {};

$(document).ready(function() {
    $('input[name="fileType"][value="' + raw_myOptions[0] + '"]').prop('checked', true);
    temp_options["fq"]=[]
    temp_options["bam"]=[]
    temp_options["other"]=[]
    temp_options["all"]=[]

    
    if (fq_type === "pair" && raw_myOptions[0] === "raw.fq.gz") {
        temp_options["fq"] = ["raw_1.fq.gz", "raw_2.fq.gz"];
        temp_options["all"] = ["raw_1.fq.gz", "raw_2.fq.gz"];
    }else if (fq_type === "single" && raw_myOptions[0] === "raw.fq.gz"){
        temp_options["fq"] = ["raw.fq.gz"];
        temp_options["all"] = ["raw.fq.gz"];
    }else {
        temp_options["bam"] = ["raw.bam"];
        temp_options["all"] = ["raw.bam"];
    }

    $('input[name="fileType"]').change(function() {
        raw_myOptions = [$(this).val()];
        localStorage.setItem('selectedFileType', $(this).val());
        location.reload();
    });
    $('input[name="fqType"][value="' + fq_type + '"]').prop('checked', true);
    $('input[name="fqType"]').change(function() {
        fq_type = $(this).val();
        localStorage.setItem('selectedFqType', fq_type);
        location.reload();
    });



});


var task_id="{{task_id}}";



</script>
