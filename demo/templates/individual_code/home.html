{% extends 'base.html' %}
{% from 'bootstrap4/form.html' import render_form %}

{% block content %}
<style>
#input-scroll-container {
  width: 100%;
  height: 200px; /* 调整这个高度根据你的页面需求 */
  overflow-y: auto; /* 启用滚动条 */
  margin-bottom: 10px;
  border: 1px solid #ccc; /* 边框样式 */
}

#input-container div {
  margin-top: 10px;
}
.input-field {
    width: 50%; /* 可以调整为你需要的长度，如300px或100% */
}

#submit-all {
  display: block; /* 确保按钮是块级元素 */
  width: 100%;
  padding: 10px;
  background-color: #4CAF50;
  color: white;
  border: none;
  cursor: pointer;
}
.radio-group {
  background: #fff;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  display: flex;
  gap: 10px;
}

input[type="radio"] {
  display: none;
}

.radio-label {
  padding: 10px 20px;
  border: 2px solid #ddd;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.3s ease;
  background-color: #fff; /* 默认无色 */
  color: #666; /* 默认深灰色文字 */
}

.single {
  /* 未选中时保持无色 */
}

.double {
  /* 未选中时保持无色 */
}

.active-single {
  border-color: #FFD700;
  background: #FFD700;
  color: white;
}

.active-double {
  border-color: #FF6347;
  background: #FF6347;
  color: white;
}

    .radio-toolbar {
        display: flex;
        justify-content: flex-start; /* 左对齐 */
        align-items: center; /* 垂直居中 */
        margin-bottom: 10px; /* 为整个行添加下边距 */
    }
    .form-check-inline {
        margin-right: 60px; /* 组内元素间的间距 */
    }
    .group-divider {
        margin-right: 5px; /* 两组之间的间距 */
    }
</style>


<div class="container">
    <h1 class="text-center my-4">单样本复杂流程设计</h1>
    <div class="row">
        <div class="col-md-12 text-center">
            <button id="WGSBtn" class="btn btn-primary m-2">WGS流程预设1</button>
            <button id="WGBSBtn" class="btn btn-primary m-2">WGBS流程预设1</button>
            <button id="CSBtn" class="btn btn-primary m-2">CS流程预设</button>
            <button id="CAPSBtn" class="btn btn-primary m-2">CAPS流程预设</button>
        </div>



<h2 class="h5">点击按钮指定输入文件</h2>
<div id="file-type-buttons">
  <button class="btn btn-primary btn-sm m-1" name-type="_1.fq.gz" data-type="fq1" >fq1文件</button>
  <button class="btn btn-primary btn-sm m-1" name-type="_2.fq.gz" data-type="fq2" >fq2文件</button>
  <button class="btn btn-primary btn-sm m-1" name-type=".fq.gz" data-type="fq" >fq文件</button>
  <button class="btn btn-primary btn-sm m-1" name-type=".bam" data-type="bam" >bam文件</button>
  <button class="btn btn-primary btn-sm m-1" name-type=".bed" data-type="bed" >bed文件</button>
  <button class="btn btn-primary btn-sm m-1" name-type=".other" data-type="other" >other文件</button>
</div>

<div id="input-scroll-container">
  <div id="input-container"></div>
</div>

<button id="submit-all">提交所有输入文件路径</button>

    <div class="row mt-4">
        <div class="col-md-3">
            <div class="border p-3 box-fixed-height">
                <h2 class="h5">选择的步骤</h2>
                <ul id="selected-steps" class="list-group"></ul>
            </div>
        </div>
        <div class="col-md-6">
            <div class="border p-3 box-fixed-height">
                <h2 class="h5">输入参数</h2>
                <div id="inputArea"></div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="border p-3 box-fixed-height">
                <h2 class="h5">选择索引</h2>
                <div id="indexArea"></div>
            </div>
        </div>
    </div>
    <div class="text-center my-4">
        <button id="confirmBtn" class="btn btn-success">确定</button>
        <button id="unlockBtn" class="btn btn-warning">解锁</button>
        <button id="submitBtn" class="btn btn-primary" disabled>提交</button>
    </div>


<div class="radio-group">
  <input type="radio" id="single-ended" name="connection" value="single">
  <label for="single-ended" class="radio-label single">单端</label>

  <input type="radio" id="double-ended" name="connection" value="pair" checked>
  <label for="double-ended" class="radio-label double">双端</label>
</div>

    <!-- Include the workflow HTML here -->
    {% include 'individual_code/workflow.html' %}
</div>



<script>
document.querySelectorAll('.radio-label').forEach(label => {
  label.addEventListener('click', function() {
    document.querySelectorAll('.radio-label').forEach(lab => {
      // Reset to default
      lab.classList.remove('active-single', 'active-double');
    });
    if (this.classList.contains('single')) {
      this.classList.add('active-single');
    } else {
      this.classList.add('active-double');
    }
  });
});

// Ensure the default checked status is correctly displayed on initial load
window.onload = () => {
  const defaultChecked = document.querySelector('input[name="connection"]:checked + .radio-label');
  if (defaultChecked.classList.contains('single')) {
    defaultChecked.classList.add('active-single');
  } else {
    defaultChecked.classList.add('active-double');
  }
};





let filePaths = {};
document.querySelectorAll('#file-type-buttons button').forEach(button => {
  button.addEventListener('click', function() {
    const fileType = this.getAttribute('data-type');
    const nameType = this.getAttribute('name-type');
    document.getElementById('input-container').innerHTML += `<div><label>输入${fileType}文件位置：</label><input type="text" name="${fileType}" class="input-field" placeholder="例如：/path/to/input${nameType}"></div>`;
  });
});
document.getElementById('submit-all').addEventListener('click', function() {
  const inputs = document.querySelectorAll('#input-container input');
  filePaths = Array.from(inputs).reduce((acc, input) => {
    if (!acc[input.name]) {
      acc[input.name] = [];
    }
    acc[input.name].push(input.value);
    return acc;
  }, {});
  console.log(filePaths); // 这里可以改为向服务器发送请求
});






</script>



<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
<script src="{{ url_for('static', filename='js/individual_code.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/project_init.js') }}"></script>         
<script src="{{ url_for('static', filename='js/modules/disableButtons.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/display.js') }}"></script>
{% endblock %}
