{% extends 'base.html' %}
{% from 'bootstrap4/form.html' import render_form %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <h1><strong>{{ form.pipeline |upper}}分析流程 </strong></h1>
    </div>
    <div class="row mt-4">
        <div class="col-md-3">
            <div class="border p-3 box-fixed-height">
                <h2 class="h5">选择的步骤</h2>
                <ul id="selected-steps" class="list-group"></ul>
            </div>
        </div>
        <div class="col-md-6">
            <div class="border p-3 box-fixed-height">
                <h2 class="h5">输入参数</h2>
                <div id="inputArea"></div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="border p-3 box-fixed-height">
                <h2 class="h5">选择索引</h2>
                <div id="indexArea"></div>
            </div>
        </div>
    </div>
    <div class="text-center my-4">
        <button id="confirmBtn" class="btn btn-success">确定步骤软件</button>
        <button id="paramBtn" class="btn btn-warning">确认输入参数</button>
        <button id="submitBtn" class="btn btn-primary" disabled>提交任务</button>
    </div>
    <div class="row h-100 page-header justify-content-center align-items-center">
        <h2>样本数据</h2>
    </div>
    <div class="row h-100 justify-content-center align-items-center">
        {{df_data|safe}}
    </div>
    <div class="container mt-5">
        <div class="col-md-12">
            <pre><code class="hljs language-python" id="dynamicCode"># 这里将展示从服务器获取的代码</code></pre>
        </div>
    </div>

</div>

<script>
    var form = {{ form | tojson | safe }};
    var task_id = "{{ task_id }}"
    let steps = [];
    let soft_step = [];
</script>
<script src="{{ url_for('static', filename='js/biology/biology.js') }}"></script>
{% endblock %}
