available_steps:
  Trim 操作:
    - "Trim trim_galore"
    - "Trim fastp"
    - "Trim cutadapt"
    - "Trim hairpin_cut"
    - "Trim hairpin_cut_N"
    - "Trim hairpin_cut_L"
  比对操作:
    - "map bwa"
    - "map bwa_spikein"
    - "map bowtie2"
    - "map bowtie2_spikein"
    - "map bismark"
    - "map bismark_spikein"
    - "map STAR"
  BAM 文件操作:
    - "BAM remove_duplicates"
    - "BAM clipOverlap"
    - "BAM samtools_merge"
    - "BAM astair_call_modify"
    - "BAM astair_spikein_modify"
    - "BAM CGS_call_modify"
    - "BAM CGS_spikein_modify"
    - "BAM CT_call_modify"
    - "BAM CT_spikein_modify"
    - "BAM TBS_call_modify"
    - "BAM TBS_spikein_modify"
    - "BAM CT_XM_bam"
    - "BAM CT_XM_sp_bam"
  其他:
    - "other qualimap_cover"
    - "other featureCounts"

available_steps2:
  cover 绘图:
    - "plot bam_split_cover_depth"


common_pair_fastq_input: &common_pair_fastq_input
  fq1: 
    fq1: "step{step_id}_{step_type}.{sample}_1.fq.gz"
  fq2: 
    fq2: "step{step_id}_{step_type}.{sample}_2.fq.gz"
common_single_fastq_input: &common_single_fastq_input
  fq:
    fq: "step{step_id}_{step_type}.{sample}.fq.gz"
common_pair_fastq_output: &common_pair_fastq_output
  fq1:
    fq1: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}_1.fq.gz"
  fq2:
    fq2: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}_2.fq.gz"
common_single_fastq_output: &common_single_fastq_output
  fq:
    fq: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}.fq.gz"
common_hairpin_cut_output: &common_hairpin_cut_output
  fq1:
    fq1: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}_1.fq.gz"
  fq2:
    fq2: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}_2.fq.gz"
  fq:
    fq: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}.fq.gz"
common_CGS_input: &common_CGS_input
  bam:
    bam: "step{step_id}_{step_type}.{sample}.bam"
  fq1:
    fq1: "step{step_id}_{step_type}.{sample}_1.fq.gz"
common_CGS_output: &common_CGS_output
  bed:
    mc: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}.mc.all.bed"
    hmc: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}.hmc.all.bed"
common_XM_input: &common_XM_input
  bam:
    bam: "step{step_id}_{step_type}.{sample}.bam"
  fq1:
    fq1: "step{step_id}_{step_type}.{sample}_1.fq.gz"
  fq2:
    fq2: "step{step_id}_{step_type}.{sample}_2.fq.gz"
common_bam_input: &common_bam_input
  bam:
    bam: "step{step_id}_{step_type}.{sample}.bam"
common_bam_output: &common_bam_output
  bam:
    bam: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}.bam"
common_txt_output: &common_txt_output
  txt:
    txt: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}.txt"
common_bed_output: &common_bed_output
  txt:
    txt: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}.bed"
common_TwoBam_input: &common_TwoBam_input
  bam:
    bam1: "step{step_id}_{step_type}.{sample}.bam"
    bam2: "step{step_id}_{step_type}.{sample}.bam"
test_output: &common_test_output
  bam:
    bam: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}_test.bam"

soft_config:
  # Trim 操作
  Trim:
    pair:
      input: *common_pair_fastq_input
      output: *common_pair_fastq_output
    single:
      input: *common_single_fastq_input
      output: *common_single_fastq_output
  hairpin_cut: &hairpin_cut_anchor
    pair:
      input: *common_pair_fastq_input
      output: *common_hairpin_cut_output
    single:
      input: *common_pair_fastq_input
      output: *common_hairpin_cut_output
  hairpin_cut_N:
    <<: *hairpin_cut_anchor
  hairpin_cut_L:
    <<: *hairpin_cut_anchor
  # 比对操作
  map:
    pair:
      input: *common_pair_fastq_input
      output: *common_bam_output
    single:
      input: *common_single_fastq_input
      output: *common_bam_output
  bwa: &bwa_anchor
    pair:
      input: *common_pair_fastq_input
      output: *common_bam_output
      params: " | samtools view -bh -F 256 -F 2048 -@ 10"
    single:
      input: *common_single_fastq_input
      output: *common_bam_output
      params: " | samtools view -bh -F 256 -F 2048 -@ 10"
  bowtie2:
    pair:
      input: *common_pair_fastq_input
      output: *common_bam_output
      params: " | samtools view -bS -F 256 -F 2048 - "
    single:
      input: *common_single_fastq_input
      output: *common_bam_output
      params: " | samtools view -bS -F 256 -F 2048 - "

  # BAM 文件操作
  BAM:
    pair:
      input: *common_bam_input
      output: *common_bam_output
    single:
      input: *common_bam_input
      output: *common_bam_output
  samtools_merge:
    pair:
      input: *common_TwoBam_input
      output: *common_bam_output
    single:
      input: *common_TwoBam_input
      output: *common_bam_output
  CGS_call_modify: &CGS_anchor
    pair:
      input: *common_CGS_input
      output: *common_CGS_output
    single:
      input: *common_CGS_input
      output: *common_CGS_output
  CT_XM_bam: &XM_anchor
    pair:
      input: *common_bam_input
      output: *common_bam_output
      params: "--rule CT"
    single:
      input: *common_bam_input
      output: *common_bam_output
      params: "--rule CT"
  astair_call_modify: &astair_anchor
    pair:
      input: *common_bam_input
      output: *common_bed_output
      params: "-sc True"
    single:
      input: *common_bam_input
      output: *common_bed_output
      params: "-sc True"
  astair_spikein_modify:
    <<: *astair_anchor
  CGS_spikein_modify:
    <<: *CGS_anchor
  CT_call_modify:
    <<: *CGS_anchor
  CT_spikein_modify:
    <<: *CGS_anchor
  TBS_call_modify:
    <<: *CGS_anchor
  TBS_spikein_modify:
    <<: *CGS_anchor
  CT_XM_sp_bam:
    <<: *XM_anchor
  # 其他操作
  other:
    pair:
      input: *common_bam_input
      output: *common_txt_output
    single:
      input: *common_bam_input
      output: *common_txt_output
  # 其他操作
  plot:
    pair:
      input: *common_bam_input
      output: *common_txt_output
      params: "--num 10"
    single:
      input: *common_bam_input
      output: *common_txt_output
      params: "--num 10"



index_options_dict:
  default:
    ref:
      mouse: [mm9, mm10, mm39]
      human: [hg18, hg19, hg38, hs1]
  STAR:
    ref:
      mouse: [ mm9, mm10, mm39 ]
      human: [ hg18, hg19, hg38, hs1 ]
    gtf: [a1, a2]
    overhang: ["149", "99"]
  featureCounts:
    gtf: [a1, a2]


