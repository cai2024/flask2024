available_steps:
  Trim 操作:
    - "Trim trim_galore"
    - "Trim fastp"
    - "Trim cutadapt"
    - "Trim hairpin_cut"
    - "Trim hairpin_cut_N"
  比对操作:
    - "map bwa"
    - "map bwa_spikein"
    - "map bowtie2"
    - "map bowtie2_spikein"
    - "map bismark"
    - "map bismark_spikein"
    - "map STAR"
  BAM 文件操作:
    - "BAM remove_duplicates"
    - "BAM CGS_call_modify"
    - "BAM CGS_spikein_modify"
    - "BAM CT_call_modify"
    - "BAM CT_spikein_modify"
    - "BAM TBS_call_modify"
    - "BAM TBS_spikein_modify"
  其他:
    - "other qualimap_cover"
    - "other featureCounts"


common_pair_fastq_input: &common_pair_fastq_input
  fq1: "step{step_id}_{step_type}.{sample}_1.fq.gz"
  fq2: "step{step_id}_{step_type}.{sample}_2.fq.gz"
common_single_fastq_input: &common_single_fastq_input
  fq: "step{step_id}_{step_type}.{sample}.fq.gz"
common_pair_fastq_output: &common_pair_fastq_output
  fq1: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}_1.fq.gz"
  fq2: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}_2.fq.gz"
common_single_fastq_output: &common_single_fastq_output
  fq: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}.fq.gz"
common_hairpin_cut_output: &common_hairpin_cut_output
  fq1: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}_1.fq.gz"
  fq2: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}_2.fq.gz"
  fq: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}.fq.gz"
common_CGS_input: &common_CGS_input
  bam: "step{step_id}_{step_type}.{sample}.bam"
  fq1: "step{step_id}_{step_type}.{sample}_1.fq.gz"
common_CGS_output: &common_CGS_output
  bed_mc: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}.mc.all.bed"
  bed_hmc: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}.hmc.all.bed"
common_bam_input: &common_bam_input
  bam: "step{step_id}_{step_type}.{sample}.bam"
common_bam_output: &common_bam_output
  bam: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}.bam"
common_txt_output: &common_txt_output
  txt: "{{output_dir}}/{{sample}}/{input_step}_{input_soft}/{input_soft}_{{sample}}.txt"
soft_config:
  # Trim 操作
  Trim:
    pair:
      input: *common_pair_fastq_input
      output: *common_pair_fastq_output
    single:
      input: *common_single_fastq_input
      output: *common_single_fastq_output
  hairpin_cut: &hairpin_cut_anchor
    pair:
      input: *common_pair_fastq_input
      output: *common_hairpin_cut_output
    single:
      input: *common_pair_fastq_input
      output: *common_hairpin_cut_output
  hairpin_cut_N:
    <<: *hairpin_cut_anchor
  # 比对操作
  map:
    pair:
      input: *common_pair_fastq_input
      output: *common_bam_output
    single:
      input: *common_single_fastq_input
      output: *common_bam_output
  # BAM 文件操作
  BAM:
    pair:
      input: *common_bam_input
      output: *common_bam_output
    single:
      input: *common_bam_input
      output: *common_bam_output
  CGS_call_modify: &CGS_anchor
    pair:
      input: *common_CGS_input
      output: *common_CGS_output
    single:
      input: *common_CGS_input
      output: *common_CGS_output
  CGS_spikein_modify:
    <<: *CGS_anchor
  CT_call_modify:
    <<: *CGS_anchor
  CT_spikein_modify:
    <<: *CGS_anchor
  TBS_call_modify:
    <<: *CGS_anchor
  TBS_spikein_modify:
    <<: *CGS_anchor
  # 其他操作
  other:
    pair:
      input: *common_bam_input
      output: *common_txt_output
    single:
      input: *common_bam_input
      output: *common_txt_output


index_options_dict:
  default:
    ref:
      mouse: [mm9, mm10, mm39]
      human: [hg18, hg19, hg38, hs1]
  STAR:
    ref:
      mouse: [ mm9, mm10, mm39 ]
      human: [ hg18, hg19, hg38, hs1 ]
    gtf: [a1, a2]
    overhang: ["149", "99"]
  featureCounts:
    gtf: [a1, a2]


