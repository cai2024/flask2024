
map bwa:
  pair: |
    mkdir -p $output_dir/${{sample}}/{step}_bwa
    $bwa mem {params} -t 10 $ref_path/{{step}_ref_species}/{{step}_ref_release}/bwa/{{step}_ref_release}.fa {fq1} {fq2} | \
    samtools view -bh -F 256 -F 2048 -@ 10 | \
    samtools sort -@ 10 -o $output_dir/${{sample}}/{step}_bwa/${{sample}}.bam >> $output_dir/logs/${{sample}}/{step}_bwa/${{sample}}.log 2>&1
    samtools index $output_dir/${{sample}}/{step}_bwa/${{sample}}.bam
  single: |
    mkdir -p $output_dir/${{sample}}/{step}_bwa
    $bwa mem {params} -t 10 $ref_path/{{step}_ref_species}/{{step}_ref_release}/bwa/{{step}_ref_release}.fa {fq} | \
    samtools view -bh -F 256 -F 2048 -@ 10 | \
    samtools sort -@ 10 -o $output_dir/${{sample}}/{step}_bwa/${{sample}}.bam >> $output_dir/logs/${{sample}}/{step}_bwa/${{sample}}.log 2>&1
    samtools index $output_dir/${{sample}}/{step}_bwa/${{sample}}.bam

  simple_pair: "bwa mem {params} index_name sample_1.fq.gz sample_2.fq.gz -t 10"
  simple_single: "bwa mem {params} index_name sample.fq.gz -t 10"

