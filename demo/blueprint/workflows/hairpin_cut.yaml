
Trim hairpin_cut:
  pair: |
    mkdir -p $output_dir/${{sample}}/{step}_hairpin_cut
    python3 $py_ref/new_hairpin_cut.py --fq1 {fq1} --fq2 {fq2} --cut_fq1 $output_dir/${{sample}}/{step}_hairpin_cut/hairpin_cut_${{sample}}_1.fq \
    --cut_fq2 $output_dir/${{sample}}/{step}_hairpin_cut/hairpin_cut_${{sample}}_2.fq --cut_fq $output_dir/${{sample}}/{step}_hairpin_cut/hairpin_cut_${{sample}}.fq {params} --parallel 10 > $output_dir/logs/${{sample}}/{step}_hairpin_cut/${{sample}}.log 2>&1
    python3 $py_ref/wild_stats.py --fq1 $output_dir/${{sample}}/{step}_hairpin_cut/hairpin_cut_${{sample}}_1.fq --fq2 $output_dir/${{sample}}/{step}_hairpin_cut/hairpin_cut_${{sample}}_2.fq >> $output_dir/logs/${{sample}}/{step}_hairpin_cut/${{sample}}.log 2>&1
    gzip $output_dir/${{sample}}/{step}_hairpin_cut/hairpin_cut_${{sample}}_1.fq $output_dir/${{sample}}/{step}_hairpin_cut/hairpin_cut_${{sample}}_2.fq $output_dir/${{sample}}/{step}_hairpin_cut/hairpin_cut_${{sample}}.fq


  simple_pair: "python3 $py_ref/new_hairpin_cut.py {params} --fq1 sample_1.fq.gz --fq2 sample_2.fq.gz --cut_fq1 hairpin_cut_sample_1.fq --cut_fq1 hairpin_cut_sample_1.fq --cut_fq1 hairpin_cut_sample_1.fq --parallel 10 "

